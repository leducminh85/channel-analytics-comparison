services:
  app:
    build: .
    container_name: channel_analytics_app
    ports:
      - "3002:3000"
    environment:
      # Database connection URL inside the Docker network
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/channel_analytics?schema=public
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=your-secret-key-change-this-in-production
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - VIDIQ_BEARER_TOKEN=${VIDIQ_BEARER_TOKEN}
      - VIDIQ_BEARER_TOKEN2=${VIDIQ_BEARER_TOKEN2}
      - VIDIQ_BEARER_TOKEN3=${VIDIQ_BEARER_TOKEN3}
      - VIDIQ_BEARER_TOKEN4=${VIDIQ_BEARER_TOKEN4}
      - VIDIQ_BEARER_TOKEN5=${VIDIQ_BEARER_TOKEN5}
      - VIDIQ_BEARER_TOKEN6=${VIDIQ_BEARER_TOKEN6}
      - VIDIQ_CLIENT_ID=${VIDIQ_CLIENT_ID}
      - AI_CHAT_PROVIDER=${AI_CHAT_PROVIDER:-auto}
      - AI_CHAT_ENABLE_TOOLS=${AI_CHAT_ENABLE_TOOLS:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: channel_analytics_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: channel_analytics
    ports:
      - "5433:5432"
    volumes:
      # Persist database data to the local postgres-data directory
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
